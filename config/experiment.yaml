model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  backend: transformers   # needs token probabilities for C2; Ollama as optional speed comparison
  quantization: none      # CPU-only laptop proxy; GGUF Q4 comparison is an optional extension
  temperature: TBD
  seeds: [1, 2, 3]        # "stable across runs" needs more than one seed
data:
