  dev_fraction: 0.2       # 30-40 dev texts needed; raise if n_texts is low
conditions: [C1, C2, C3, C4, C5]
probability_filter:
  threshold: TBD          # tuned on dev only
  go_no_go: "go: text-bootstrap 95% lower bound > 0.5; inconclusive: AUC >= 0.60 but lower bound <= 0.5 (add dev texts once); else no-go, drop C2 and C5 probability step"
lookup:
  wordlist: wordlists/TBD
grammar_rules: TBD
