# The Llama 3.2 chat template writes today's date into the system prompt (strftime_now), so the same text, seed and weights give a different
# prompt, and often different sampled tokens, on a different day (found 2026-11-02: 51 of 64 stored Llama dev outputs did not regenerate).
# Every v3 prompt for a model whose template uses the date is built with this one value: the day the Llama dev outputs were generated
# (2026-10-31). Use it for all future Llama runs including held-out; change it only with a logged protocol amendment. Qwen's template has no date.
chat_template_date_string: "31 Oct 2026"
